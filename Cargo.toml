[package]
name = "robigo"
description = "A modern engine for The Settlers II, written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
s2-assets = { workspace = true }
s2-audio = { workspace = true }
s2-data = { workspace = true }
s2-formats = { workspace = true }
s2-mods = { workspace = true }
s2-platform = { workspace = true }
s2-render = { workspace = true }
s2-sim = { workspace = true }
s2-ui = { workspace = true }
clap = { workspace = true }
png = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indicatif = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
s2-assets = { path = "crates/s2-assets" }
s2-audio = { path = "crates/s2-audio" }
s2-data = { path = "crates/s2-data" }
s2-formats = { path = "crates/s2-formats" }
s2-mods = { path = "crates/s2-mods" }
s2-platform = { path = "crates/s2-platform" }
s2-render = { path = "crates/s2-render" }
s2-sim = { path = "crates/s2-sim" }
s2-systems = { path = "crates/s2-systems" }
s2-ui = { path = "crates/s2-ui" }

thiserror = "2"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
png = "0.18"
rayon = "1.12"
toml = { version = "0.9", features = ["preserve_order"] }
indicatif = "0.18"
bitflags = { version = "2.13", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
tar = { version = "0.4.46", default-features = false }
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "flac"] }
flacenc = { version = "0.5.1", default-features = false }
nuked-opl3 = { version = "0.1.0", default-features = false }
rustysynth = "1.3.8"
sha2 = "0.11.1"
ureq = "3.5.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The CD rip encodes and checks half an hour of audio; unoptimised, a debug bake takes minutes.
[profile.dev.package.flacenc]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

# nuked-opl3 0.1.0 overflows working out a slot index for an unused register, then discards it (#105).
[profile.dev.package.nuked-opl3]
opt-level = 3
overflow-checks = false

# The sim's tests play hours of game time; `cargo test` builds the sim optimised and `cargo build` does not.
[profile.test.package.s2-sim]
opt-level = 2
